<style>
:root{--ink:#0f172a;--mut:#5b6478;--line:#e2e8f0;--bg:#C2D7EC;--brand:#2f4fd8;--brand2:#4f46e5;--r:16px;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#d3e3f4 0,#C2D7EC 360px);background-attachment:fixed;color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.promo{background:linear-gradient(90deg,#1d4ed8,#4338ca);color:#fff;text-align:center;padding:10px 14px;font-weight:600;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.promo a,.btn-ext{background:#fbbf24;color:#1c1917;padding:6px 16px;border-radius:99px;text-decoration:none;font-weight:700;font-size:13px;transition:transform .15s,box-shadow .15s}
.promo a:hover,.btn-ext:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
header.hero{text-align:center;padding:48px 16px 14px}
h1{margin:0;font-size:clamp(30px,5.2vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero p{max-width:600px;margin:12px auto 0;color:var(--mut);font-size:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:20px 16px 8px}
.tabs button{border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.75);backdrop-filter:blur(6px);color:var(--ink);padding:9px 18px;border-radius:99px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.tabs button:hover{background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 14px rgba(15,23,42,.25)}
main{max-width:1160px;margin:0 auto;padding:12px 16px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:22px 18px 20px;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.card .ic{font-size:30px;line-height:1;height:48px;display:flex;align-items:center;justify-content:center}
.card .ic svg{display:block;height:40px;width:auto}
.card .ic svg.s95{height:38px}
.card h3{text-align:center}
#dt svg{height:26px;width:auto;vertical-align:middle}
.card .ic img{height:44px;width:auto;display:block}
.card h3{margin:12px 0 4px;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.card p{margin:0;font-size:13.5px;color:var(--mut)}
.card.live{cursor:pointer}
.card.live:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(15,23,42,.14)}
.card.live:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card.soon{opacity:.6}
.tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:#eef2f7;color:var(--mut)}
.live .tag{background:#dcfce7;color:#166534}
[data-cat=organize]{--c:#ef4444}[data-cat=optimize]{--c:#22c55e}[data-cat=convert]{--c:#3b6df0}
[data-cat=edit]{--c:#8b5cf6}[data-cat=security]{--c:#f59e0b}[data-cat=ai]{--c:#06b6d4}
dialog{border:0;border-radius:22px;padding:0;width:min(580px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(10,20,50,.4);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(4px)}
.dh{padding:24px 26px 6px}.dh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}.dh p{margin:6px 0 0;color:var(--mut);font-size:14px}
.db{padding:14px 26px 26px}
.pick{display:block;border:2px dashed #b4c0dc;border-radius:14px;padding:26px 20px;text-align:center;cursor:pointer;color:var(--mut);background:#f8faff;font-weight:600;transition:all .15s}
.pick:hover{border-color:var(--brand);color:var(--brand);background:#eef2ff}
.pick input{display:none}
ul#fl{list-style:none;margin:12px 0;padding:0}
ul#fl li{display:flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:14px;background:#fff}
ul#fl li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul#fl small{color:var(--mut)}
ul#fl button{border:0;background:#eef2f7;border-radius:8px;width:30px;height:30px;cursor:pointer;transition:background .15s}
ul#fl button:hover{background:#dbe3ef}
#op label{display:block;margin:12px 0 0;font-size:14px;font-weight:600}
#op input[type=text],#op input[type=number],#op input[type=password],#op input[type=file],#op textarea,#op select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff;transition:border-color .15s,box-shadow .15s}
#op input:focus,#op textarea:focus,#op select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,79,216,.18)}
#op textarea{font:inherit;resize:vertical}
#op .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#op label.ck{font-weight:400;display:flex;gap:8px;align-items:center}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s}
.row button:active{transform:scale(.98)}
#go{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(47,79,216,.3)}#go:hover{box-shadow:0 8px 22px rgba(47,79,216,.4)}#go:disabled{opacity:.5;cursor:wait}
#cl{background:#eef2f7;color:var(--ink);flex:0 0 96px!important}#cl:hover{background:#e2e8f0}
#st{margin-top:14px;font-size:14px;border-radius:12px}
#st.err{color:#b3261e;background:#fdecea;padding:12px}
#st.ok{color:#166534;background:#e8f7ee;padding:12px}
#st .df{max-height:240px;overflow:auto;font-size:13px;text-align:left;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#st .df div{padding:2px 0;border-bottom:1px dashed #eee;word-break:break-word}.df .ad{color:#166534}.df .rm{color:#b3261e}
#st.ok .btn-ext{display:inline-block;margin-top:6px}
#ifd{width:min(1120px,96vw);height:92vh;overflow:hidden}
#ifd[open]{display:flex;flex-direction:column}
.ifh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;font-size:15px}
.ifh button{border:0;background:#eef2f7;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
.ifh button:hover{background:#e2e8f0}
#ifr{flex:1;width:100%;border:0}
.flogo{display:inline-block;margin-bottom:6px}.flogo img{height:36px;width:auto;display:block}
.hlogo{display:inline-block;margin-bottom:10px}.hlogo img{height:60px;width:auto;display:block}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px;border-top:1px solid var(--line);background:rgba(255,255,255,.9)}
[hidden]{display:none!important}
#op .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#op .chips label{position:relative;margin:0;font-weight:600;cursor:pointer}
#op .chips input{position:absolute;opacity:0;pointer-events:none}
#op .chips span{display:inline-block;padding:9px 16px;border:1px solid #cbd5e1;border-radius:99px;background:#fff;font-size:14px;transition:all .15s}
#op .chips input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
#op .chips input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.szm{margin-top:14px;display:flex;align-items:center;gap:12px}
.szm input{flex:1}.szm b{min-width:46px;text-align:right}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px 10px 14px}.card h3{font-size:14.5px}.dh{padding:20px 18px 4px}.db{padding:12px 18px 20px}header.hero{padding-top:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const BADGE = {pdf:['#E5322D','PDF',13]};
const bdg = (k, x) => { const [c, t, fs] = BADGE[k]; return `<rect x="${x}" y="0" width="36" height="36" rx="8" fill="${c}"/><rect x="${x}" y="0" width="9" height="36" rx="4" fill="#000" opacity=".12"/><text x="${x+19}" y="22.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="${fs}" fill="#fff">${t}</text>`; };

const office = (x, bands, front, letter, extra) => {
  const [a,b,c,d] = bands, id = 'o'+x+letter;
  return `<defs><clipPath id="${id}"><rect x="${x+9}" y="2" width="27" height="32" rx="3.5"/></clipPath></defs>`
   + `<g clip-path="url(#${id})"><rect x="${x+9}" y="2" width="27" height="8" fill="${a}"/><rect x="${x+9}" y="10" width="27" height="8" fill="${b}"/><rect x="${x+9}" y="18" width="27" height="8" fill="${c}"/><rect x="${x+9}" y="26" width="27" height="8" fill="${d}"/>${extra(x)}</g>`
   + `<rect x="${x}" y="8.5" width="21" height="19" rx="3" fill="${front}"/><rect x="${x}" y="8.5" width="21" height="19" rx="3" fill="none" stroke="#000" stroke-opacity=".10"/>`
   + `<text x="${x+10.5}" y="23.2" text-anchor="middle" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#fff">${letter}</text>`;
};

  page.drawImage(A.logo, {x:sx, y:ly, width:lw, height:lh});
  const tx = sx+lw+gap, ty = ly+(lh-fs*.72)/2;
  page.drawText(BRAND_TXT, {x:tx, y:ty, size:fs, font:A.font, color:blue});

function pageToDocx(items){
  const F = 'Nirmala UI', W = [];
  const tr = (t, s, b) => new docx.TextRun({text: t.replace(/\s+/g,' ').trim(), size: s, bold: !!b, font: F});
  const para = (t, h = 11) => new docx.Paragraph({spacing:{after:120}, children:[tr(t, Math.max(18, Math.min(44, Math.round(h*2))), h >= 14)]});
  const its = items.filter(it => 'str' in it && it.str.trim())
    .map(it => ({t:it.str, x:it.transform[4], y:it.transform[5], w:it.width, h:Math.abs(it.height) || 10}))
    .sort((a,b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for(const it of its){
    const L = lines[lines.length-1];
    if(L && Math.abs(it.y - L.y) < it.h*.5) L.items.push(it); else lines.push({y:it.y, h:it.h, items:[it]});
  }
  for(const L of lines){
    L.items.sort((a,b) => a.x - b.x); L.cells = []; let c = null;
    for(const it of L.items){
      const gap = c ? it.x - c.x2 : 0;
      if(c && gap <= Math.max(L.h, 10)){ c.t += (gap > L.h*.15 && !/\s$/.test(c.t) && !/^\s/.test(it.t) ? ' ' : '') + it.t; c.x2 = Math.max(c.x2, it.x + it.w); }
      else { c = {x:it.x, x2:it.x + it.w, t:it.t}; L.cells.push(c); }
    }
  }
  let pt = null, ph = 11, pv = null, tb = null;
  const flushP = () => { if(pt){ W.push(para(pt, ph)); pt = null; } };
  const flushT = () => {
    if(!tb) return; const rows = tb.rows; tb = null;
    const xs = rows.flat().map(c => c.x).sort((a,b) => a-b), cols = [];
    xs.forEach(x => { if(!cols.length || x - cols[cols.length-1] > 8) cols.push(x); });
    if(rows.length < 2 || cols.length < 2){ rows.forEach(r => W.push(para(r.map(c => c.t).join('    ')))); return; }
    const idx = x => { let b = 0; cols.forEach((c,i) => { if(Math.abs(c-x) < Math.abs(cols[b]-x)) b = i; }); return b; };
    const grid = rows.map(r => { const a = Array(cols.length).fill(''); r.forEach(c => { const j = idx(c.x); a[j] = (a[j] ? a[j]+' ' : '') + c.t; }); return a; });
    const sp = cols.slice(0,-1).map((c,i) => cols[i+1] - c); sp.push(sp.reduce((a,b) => a+b, 0) / sp.length);
    const sum = sp.reduce((a,b) => a+b, 0), wd = sp.map(v => Math.max(600, Math.round(v/sum*9000)));
    W.push(new docx.Table({
      width:{size:9000, type:docx.WidthType.DXA}, columnWidths:wd, layout:docx.TableLayoutType.FIXED,
      rows: grid.map(r => new docx.TableRow({children: r.map((t,j) => new docx.TableCell({width:{size:wd[j], type:docx.WidthType.DXA}, children:[new docx.Paragraph({children:[tr(t, 20)]})]}))}))
    }));
    W.push(new docx.Paragraph({children:[]}));
  };
  for(const L of lines){
    const gap = pv ? pv.y - L.y : 999;
    if(L.cells.length >= 2){
      const row = L.cells.map(c => ({x:c.x, t:c.t}));
      if(tb && gap < pv.h*3) tb.rows.push(row); else { flushP(); flushT(); tb = {rows:[row]}; }
    } else {
      const c = L.cells[0], last = tb && tb.rows[tb.rows.length-1], k = last && last.find(k => Math.abs(k.x - c.x) < 8);
      if(k && gap < L.h*1.8) k.t += ' ' + c.t;
      else {
        flushT();
        if(pt && gap > 0 && gap < pv.h*1.8 && Math.abs(L.h - ph) < 1.5) pt += ' ' + c.t; else { flushP(); pt = c.t; ph = L.h; }
      }
    }
    pv = L;
  }
  flushT(); flushP();
  return W;
}

function mkPager(W, H, S, M){
  const out = []; let c = null, g, y, used = 0;
  const flush = () => { if(c){ out.push({u: c.toDataURL('image/jpeg', .82), W, H}); c.width = c.height = 0; c = null; } };
  const np = () => { flush(); c = mkCv(W*S, H*S); g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.scale(S, S); g.textBaseline = 'top'; y = M; used = 0; };

    g.font = font; const res = [];

      if(y + lh > H - M) np();

async function pagesToPdf(items, name, extra){
  if(!items.length) throw Error('No text that can be put into a PDF was found in the file.');
  const d = await PDFLib.PDFDocument.create();
  for(let i = 0; i < items.length; i++){
    msg(`Creating PDF page ${i+1}/${items.length}…`);
    const im = await d.embedJpg(items[i].u);
    d.addPage([items[i].W, items[i].H]).drawImage(im, {x:0, y:0, width:items[i].W, height:items[i].H});
  }
  await finishPdf(d, name, extra);
}

}

}
$('#fi').onchange = async e => {
  const h = H[cur], rx = h.rx, all = [...e.target.files];
  const ok = all.filter(f => rx ? rx.test(f.name) : (/\.pdf$/i.test(f.name) || f.type == 'application/pdf'));
  const bad = all.filter(f => !ok.includes(f)); e.target.value = '';
  let add = ok;
  if(h.any){
    try { add = []; for(const [i, f] of ok.entries()){ msg(`Preparing file… (${i+1}/${ok.length})`); add.push(await toPdfFile(f)); } }
    catch(err){ return msg('Error: '+(err.message||err), 'err'); }
  }
  files = h.multi ? [...files, ...add] : add.slice(0, 1);
  if(bad.length) msg('This file is not supported: '+bad.map(f => esc(f.name)).join(', '), 'err'); else msg('');
  list(); if(h.onFiles) h.onFiles();
};
$('#fl').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  const i = +b.dataset.i, a = b.dataset.a;
  if(a=='x') files.splice(i,1);
  else { const j = a=='u' ? i-1 : i+1; if(j>=0 && j<files.length) [files[i], files[j]] = [files[j], files[i]]; }
  list(); if(H[cur].onFiles) H[cur].onFiles();
};
$('#op').addEventListener('input', e => {
  if(e.target.id == 'szr') $('#szv').textContent = e.target.value + '%';
  if(e.target.name == 'sz') $('#szm').hidden = e.target.value != 'more';
});
$('#cl').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });
$('#go').onclick = async () => {
  const h = H[cur];
  if(!files.length || (h.min && files.length < h.min)) return msg(h.need, 'err');
  $('#go').disabled = true; msg(h.en ? 'Starting…' : 'Starting…');
  try { await h.run(); }
  catch(e){ console.error(e); msg(h.en ? 'Error: '+(e.message||e)+'<br><small>The file may be password-protected or damaged.</small>' : 'Error: '+(e.message||e)+'<br><small>The file may be password-protected or damaged.</small>', 'err'); }
  $('#go').disabled = false;
};

document.addEventListener('click', e => { const a = e.target.closest('.ext,.btn-ext'); if(a) track('extension_click', {location: a.closest('.promo') ? 'top_banner' : 'after_task'}); });
$('#ifc').onclick = () => $('#ifd').close();
$('#ifd').addEventListener('click', e => { if(e.target===$('#ifd')) $('#ifd').close(); });

drawTabs(); drawGrid();
</script>
</body>
</html>
